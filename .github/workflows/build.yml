name: Build CamSwap APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Force Node.js 24 as recommended in the changelog
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract ZIP file
      run: |
        echo "Extracting ZIP..."
        unzip -o "*.zip" -d extracted/
        echo "Moving files to root..."
        mv extracted/*/* ./ 2>/dev/null || mv extracted/* ./ 2>/dev/null || true
        echo "Checking for gradlew..."
        find . -name "gradlew" -type f

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: |
        chmod +x ./gradlew 2>/dev/null || chmod +x ./Android-CamSwap-OpenSource-2.6/gradlew 2>/dev/null || echo "gradlew not found"

    - name: Build APK
      run: |
        if [ -f "./gradlew" ]; then
          echo "Building from root..."
          ./gradlew assembleDebug --stacktrace
        elif [ -f "./Android-CamSwap-OpenSource-2.6/gradlew" ]; then
          echo "Building from subfolder..."
          cd Android-CamSwap-OpenSource-2.6
          ./gradlew assembleDebug --stacktrace
        else
          echo "ERROR: gradlew not found!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: camswap-debug-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          Android-CamSwap-OpenSource-2.6/app/build/outputs/apk/debug/*.apk
