name: Build CamSwap APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # <-- Changed from ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract ZIP file
      run: |
        unzip -o "*.zip" -d extracted/
        mv extracted/*/* ./ 2>/dev/null || mv extracted/* ./ 2>/dev/null || true

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable and build
      run: |
        chmod +x ./gradlew || chmod +x ./Android-CamSwap-OpenSource-2.6/gradlew || echo "gradlew not found"
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "./Android-CamSwap-OpenSource-2.6/gradlew" ]; then
          cd Android-CamSwap-OpenSource-2.6
          ./gradlew assembleDebug
        else
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: camswap-debug-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          Android-CamSwap-OpenSource-2.6/app/build/outputs/apk/debug/*.apk
