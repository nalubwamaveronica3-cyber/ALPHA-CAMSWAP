name: Build CamSwap APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show repository contents
        run: |
          echo "=== Repository contents ==="
          find . -maxdepth 4 -type f | sort | head -500

      - name: Find and extract project ZIP
        run: |
          echo "=== Looking for ZIP files ==="

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found."
            echo "The repository must contain the CamSwap source ZIP."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          echo "=== Extracting ZIP ==="
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted contents ==="
          find extracted -maxdepth 5 -type f | sort | head -500

      - name: Find Gradle wrapper
        run: |
          echo "=== Searching for gradlew ==="

          GRADLEW=$(find extracted -name "gradlew" -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found after extracting the ZIP."
            echo "The ZIP may not contain a complete Gradle Android project."
            exit 1
          fi

          echo "Found Gradle wrapper:"
          echo "$GRADLEW"

          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Build APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "=== Building from ==="
          pwd

          echo "=== Project files ==="
          ls -la

          echo "=== Running Gradle ==="
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: camswap-debug-apk
          path: 'extracted/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
