name: Build CamSwap APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Extract ZIP file and set project root
      run: |
        # Find the first ZIP file
        ZIP_FILE=$(ls *.zip | head -1)
        echo "Found ZIP file: $ZIP_FILE"
        
        # Extract it into a folder named 'source'
        unzip -o "$ZIP_FILE" -d source/
        
        # Find the actual project folder inside 'source'
        PROJECT_FOLDER=$(find source -maxdepth 1 -type d -not -path source | head -1)
        echo "Project folder is: $PROJECT_FOLDER"
        
        # Move the contents of the project folder up to the root directory
        mv $PROJECT_FOLDER/* ./
        mv $PROJECT_FOLDER/.[!.]* ./ 2>/dev/null || true
        
        echo "Final directory structure:"
        ls -la

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable and build
      run: |
        # Ensure gradlew is executable
        chmod +x ./gradlew
        echo "Starting build..."
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: camswap-debug-apk
        path: app/build/outputs/apk/debug/*.apk
