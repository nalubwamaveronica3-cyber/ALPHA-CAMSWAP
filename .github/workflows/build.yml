name: Build CamSwap APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          echo "=== Repository contents ==="
          find . -maxdepth 3 -type f | sort | head -300

          echo "=== Finding Gradle wrapper ==="
          find . -name "gradlew" -type f -print

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "The repository does not appear to contain a Gradle Android project."
            exit 1
          fi

          echo "Found Gradle wrapper:"
          echo "$GRADLEW"

          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: camswap-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
