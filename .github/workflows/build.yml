name: Build CamSwap APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Force GitHub Actions to use Node.js 24 for all JavaScript actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract ZIP file
      run: |
        echo "Listing files before extraction:"
        ls -la
        echo "Extracting ZIP..."
        # Extract the first ZIP file found
        unzip -o "*.zip" -d extracted/
        # Move the contents of the extracted folder (which is the project root) to the current directory
        mv extracted/*/* ./ 2>/dev/null || mv extracted/* ./ 2>/dev/null || true
        echo "Files after extraction:"
        ls -la

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: |
        echo "Looking for gradlew..."
        # Find and make gradlew executable
        chmod +x ./gradlew 2>/dev/null || chmod +x ./Android-CamSwap-OpenSource-2.6/gradlew 2>/dev/null || echo "gradlew not found"
        echo "Current directory contents:"
        ls -la

    - name: Build APK
      run: |
        # Check if gradlew is in the root or in a subfolder and run the build
        if [ -f "./gradlew" ]; then
          echo "Using gradlew in root"
          ./gradlew assembleDebug
        elif [ -f "./Android-CamSwap-OpenSource-2.6/gradlew" ]; then
          echo "Using gradlew in subfolder"
          cd Android-CamSwap-OpenSource-2.6
          ./gradlew assembleDebug
        else
          echo "ERROR: gradlew not found!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: camswap-debug-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          Android-CamSwap-OpenSource-2.6/app/build/outputs/apk/debug/*.apk
